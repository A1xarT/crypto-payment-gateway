# Production deployment — extends docker-compose.yml with nginx TLS termination.
#
# Prerequisites:
#   1. Set DOMAIN in your environment (e.g. export DOMAIN=api.myshop.com)
#   2. Place TLS certificates in ./nginx/certs/
#        fullchain.pem  ← certificate + chain
#        privkey.pem    ← private key
#      Obtain with Let's Encrypt: certbot certonly --standalone -d $DOMAIN
#      Then copy: cp /etc/letsencrypt/live/$DOMAIN/fullchain.pem nginx/certs/
#                 cp /etc/letsencrypt/live/$DOMAIN/privkey.pem   nginx/certs/
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      api:
        condition: service_started
    # nginx doesn't expand env vars in config natively — use envsubst at start
    command: >
      sh -c "envsubst '$$DOMAIN' < /etc/nginx/nginx.conf > /tmp/nginx.conf
             && nginx -c /tmp/nginx.conf -g 'daemon off;'"

  api:
    # In prod, don't expose port 3000 directly — traffic goes through nginx only
    ports: []
